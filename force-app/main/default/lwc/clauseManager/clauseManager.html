<template>
    <lightning-card title="Clause Management">

        <!-- Top Right Button -->
        <div class="slds-m-around_medium slds-text-align_right">
            <lightning-button
                label="New Clause"
                variant="brand"
                onclick={handleNew}>
            </lightning-button>
        </div>

        <!-- Table -->
       <lightning-datatable
    key-field="Id"
    data={clauses}
    columns={columns}
    max-row-selection="1"
    onrowaction={handleRowAction}
    onrowselection={handleRowSelection}>
</lightning-datatable>

        <!-- Modal -->
        <template if:true={showModal}>
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">

                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Clause</h2>
                    </header>

                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input label="Clause Name" value={clause.Name} onchange={handleChange} data-field="Name"></lightning-input>
                        <lightning-input label="Region" value={clause.Region__c} onchange={handleChange} data-field="Region__c"></lightning-input>
                        <lightning-input label="Role" value={clause.Role__c} onchange={handleChange} data-field="Role__c"></lightning-input>
                        <lightning-textarea label="Clause Details" value={clause.ClauseDetails__c} onchange={handleChange} data-field="ClauseDetails__c"></lightning-textarea>
                    </div>

                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                        <lightning-button variant="brand" label="Save" onclick={saveClause}></lightning-button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </lightning-card>
</template>
